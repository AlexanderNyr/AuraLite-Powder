[package]
name = "aura-lite-ui"
version = "0.1.0"
edition = "2021"
description = "Component framework, palette, property panel"

[features]
native-ui = ["dep:egui", "dep:egui-winit", "dep:rfd", "dep:winit"]
default = ["native-ui"]

[dependencies]
aura-lite-core = { path = "../core" }
aura-lite-elements = { path = "../elements" }
aura-lite-utils = { path = "../utils" }
aura-lite-renderer = { path = "../renderer" }
aura-lite-io = { path = "../io" }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
egui = { version = "0.28", optional = true }
egui-winit = { version = "0.28", optional = true }
rfd = { version = "0.15", optional = true }
winit = { version = "0.29", optional = true }
