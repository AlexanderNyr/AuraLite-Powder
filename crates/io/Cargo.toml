[package]
name = "aura-lite-io"
version = "0.1.0"
edition = "2021"
description = "Save/load, serialization, compression"

[features]
compression = ["dep:zstd"]
default = []

[dependencies]
aura-lite-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
serde_json = "1.0"
zstd = { version = "0.13", optional = true }
thiserror = "1.0"
log = "0.4"
