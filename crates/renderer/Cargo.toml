[package]
name = "aura-lite-renderer"
version = "0.1.0"
edition = "2021"
description = "Abstract render backend (softbuffer + wgpu)"

[features]
softbuffer = ["dep:pixels", "dep:softbuffer", "dep:winit"]
wgpu = ["dep:wgpu", "dep:pollster"]
default = ["softbuffer"]

[dependencies]
aura-lite-core = { path = "../core" }
aura-lite-utils = { path = "../utils" }
aura-lite-elements = { path = "../elements" }
image = { version = "0.25", features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
pixels = { version = "0.15", optional = true }
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.29", optional = true }
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }
log = "0.4"
