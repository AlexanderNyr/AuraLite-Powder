[package]
name = "aura-lite-core"
version = "0.1.0"
edition = "2021"
description = "Core simulation kernel for AuraLite"

[features]
# P3: a physically-honest thermal model — Doppler reactivity feedback (negative
# temperature coefficient) and latent heat at phase changes. The default build
# keeps the MVP model (a mild positive temperature coefficient); enabling this
# makes a pile self-limiting. Off by default so save replay and the golden
# corpus are unchanged.
default = []
thermal-pde = []
# P5b: pressure transients — a steam explosion when water meets molten fuel
# (flashes to steam + an ejection impulse). Off by default; the MVP has no such
# transient. The full Navier-Stokes-lite solver is a later sub-phase.
fluid-pde = []

[dependencies]
aura-lite-utils = { path = "../utils" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
rayon = "1.10"
crossbeam = "0.8"
fastrand = "2.1"
log = "0.4"
