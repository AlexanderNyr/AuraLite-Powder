<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuraLite Powder</title>
<style>
body { margin:0; background:#111; color:#eee; font-family: sans-serif; display:flex; flex-direction:column; align-items:center; }
canvas { border:1px solid #555; margin-top:10px; image-rendering: pixelated; width:512px; height:512px; }
#bar button { margin:2px; }
#info { margin:10px; max-width:820px; }
</style>
</head>
<body>
<h1>AuraLite Powder</h1>
<canvas id="canvas" width="256" height="256"></canvas>
<div id="bar">
  <button data-scene="reactor">Reactor</button>
  <button data-scene="rods">Rods</button>
  <button data-scene="bomb">Pit</button>
  <button data-scene="ice">Ice</button>
  <button data-scene="hourglass">Hourglass</button>
  <button data-scene="fusion">Fusion</button>
  <button data-scene="loop">Loop</button>
  <button data-scene="fire">Fire</button>
  <button id="save">Save</button>
  <button id="load">Load</button>
</div>
<div id="palette">
  <button data-id="1">Sand</button>
  <button data-id="2">Water</button>
  <button data-id="4">U-235</button>
  <button data-id="13">Neutron</button>
  <button data-id="32">Fire</button>
  <button data-id="33">Wood</button>
  <button data-id="34">Acid</button>
  <button data-id="36">Heater</button>
  <button data-id="40">Rod</button>
  <button data-id="44">Filter</button>
  <button data-id="0">Erase</button>
</div>
<div id="info">
<p>Click/drag paint · Space pause · C clear · scenes on the top row.</p>
<div id="log">Loading…</div>
</div>
<script type="module">
import init, { create_simulation } from "./pkg/aura_lite_wasm.js";

let sim, selected = 1, painting = false, paused = false;

function gridPos(ev, canvas) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) * sim.width() / rect.width);
  const y = Math.floor((ev.clientY - rect.top) * sim.height() / rect.height);
  return [x, y];
}

async function run() {
  await init();
  sim = create_simulation(256, 256);
  const canvas = document.getElementById("canvas");
  const logEl = document.getElementById("log");

  canvas.addEventListener("mousedown", (e) => { painting = true; const [x,y] = gridPos(e, canvas); sim.paint(x, y, selected, 2, 293); });
  window.addEventListener("mouseup", () => { painting = false; });
  canvas.addEventListener("mousemove", (e) => {
    if (!painting) return;
    const [x,y] = gridPos(e, canvas);
    sim.paint(x, y, selected, 2, 293);
  });
  document.querySelectorAll("#palette button").forEach((btn) => {
    btn.addEventListener("click", () => { selected = Number(btn.dataset.id); });
  });
  document.querySelectorAll("[data-scene]").forEach((btn) => {
    btn.addEventListener("click", () => sim.load_scene(btn.dataset.scene));
  });
  document.getElementById("save").onclick = () => {
    const bytes = sim.save_bytes();
    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "auralite.aura";
    a.click();
  };
  document.getElementById("load").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.onchange = async () => {
      const buf = new Uint8Array(await inp.files[0].arrayBuffer());
      sim.load_bytes(buf);
    };
    inp.click();
  };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { paused = !paused; e.preventDefault(); }
    if (e.key === "c" || e.key === "C") sim.clear();
  });

  function frame() {
    if (!paused) sim.tick();
    sim.render("canvas");
    logEl.innerText = `particles=${sim.particle_count()} fission=${sim.fission_count()} fusion=${sim.fusion_count()} k-eff=${sim.k_effective().toFixed(3)}`;
    requestAnimationFrame(frame);
  }
  frame();
}
run();
</script>
</body>
</html>
